[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openedx-forum"
dynamic = ["version"]
description = "Open edX forum application"
readme = "README.rst"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE.txt"]
authors = [
    {name = "Open edX Project", email = "oscm@openedx.org"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
keywords = [
    "Python",
    "edx",
    "forum",
    "openedx",
]
dependencies = [
    "Django>=4.2",
    "beautifulsoup4",
    "djangorestframework",
    "openedx-atlas",
    "requests",
    "pymongo",
    "elasticsearch",
    "edx-search",
    "typesense",
    "mysqlclient",
]

[project.urls]
Repository = "https://github.com/openedx/forum"

[project.entry-points."lms.djangoapp"]
forum = "forum.apps:ForumConfig"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["forum", "forum.*"]
exclude = ["*tests"]

[tool.setuptools.package-data]
"*" = [
    "conf/**/*",
    "static/**/*",
    "templates/**/*",
    "translations/**/*",
]

# Setuptools SCM configuration
# https://setuptools-scm.readthedocs.io/
[tool.setuptools_scm]
version_scheme = "only-version"
local_scheme = "no-local-version"

# uv configuration
# https://docs.astral.sh/uv/reference/settings/
[tool.uv]
package = true
conflicts = [
    [
        {group = "test"},
        {group = "django42"},
    ],
]

# constraint-dependencies is machine-managed by edx-lint — do not edit directly.
# To regenerate, run: uv run --with edx-lint edx_lint write_uv_constraints pyproject.toml
constraint-dependencies = [
    "Django<6.0",
    "elasticsearch<7.14.0",
]

[dependency-groups]
# Base test packages, no Django version pinned
test-base = [
    "coverage",
    "pytest-cov",
    "pytest-django",
    "pytest>=7.0",
    "code-annotations",
    "mongomock",
    "Faker",
    "build",
    "twine",
    "edx-lint",
]
# Default test group: current supported Django version
# Update Django pin here when bumping the default; add a legacy group for older versions
test = [
    {include-group = "test-base"},
    "Django>=5.2,<6.0",
]
# Legacy Django 4.2 support
django42 = [
    {include-group = "test-base"},
    "Django>=4.2,<5.0",
]
quality = [
    {include-group = "test"},
    "ruff",
    "mypy",
    "djangorestframework-stubs",
    "types-beautifulsoup4",
    "types-requests",
]
doc = [
    {include-group = "test"},
    "doc8",
    "sphinx-book-theme",
    "Sphinx",
]
ci = [
    "tox",
    "tox-uv",
]
dev = [
    {include-group = "quality"},
    {include-group = "ci"},
    "diff-cover",
    "edx-i18n-tools",
]

[tool.edx_lint]
uv_constraints = []

# Ruff configuration
# https://docs.astral.sh/ruff/configuration/
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "DJ",     # flake8-django
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "DJ001",  # null=True on string-based fields (pre-existing, requires migrations to fix)
    "DJ008",  # Model missing __str__ (pre-existing, not enforced before)
    "DJ012",  # Model method order (pre-existing, not enforced before)
]

[tool.ruff.lint.per-file-ignores]
"forum/models.py" = ["F401", "F403"]  # intentional star-import re-export
"manage.py" = ["F401"]  # intentional django import for availability check

[tool.ruff.lint.isort]
known-third-party = ["django", "rest_framework", "pymongo", "elasticsearch", "typesense", "bs4"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Pytest configuration
# https://docs.pytest.org/en/stable/reference/customize.html
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "forum.settings.test"
addopts = "--cov forum --cov tests --cov-report term-missing --cov-report xml"
norecursedirs = [".*", "docs", "requirements", "site-packages", "e2e"]

# Coverage configuration
# https://coverage.readthedocs.io/en/latest/config.html
[tool.coverage.run]
branch = true
source = ["forum"]
omit = [
    "forum/settings/test.py",
    "*/migrations/*",
    "*admin.py",
    "*/static/*",
    "*/templates/*",
    "tests/e2e/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

# Mypy configuration
# https://mypy.readthedocs.io/en/stable/config_file.html
[tool.mypy]
python_version = "3.12"

disallow_untyped_defs = true
strict_optional = true
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
ignore_errors = false
ignore_missing_imports = false
implicit_reexport = false
strict_equality = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
module = "search.*"
ignore_missing_imports = true

# Semantic Release configuration
# https://python-semantic-release.readthedocs.io/
[tool.semantic_release]
# Use SETUPTOOLS_SCM_PRETEND_VERSION to set version at build time since the
# build step happens before the repo gets tagged.
build_command = "pip install build && SETUPTOOLS_SCM_PRETEND_VERSION=$NEW_VERSION python -m build"
