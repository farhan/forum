[tox]
envlist = py312-django{42,52}, quality, docs, mypy
requires = tox-uv>=1

[doc8]
; D001 = Line too long
ignore = D001

[testenv]
runner = uv-venv-lock-runner
dependency_groups =
    django42: django42
    django52: test
commands =
    python manage.py check
    pytest {posargs}

[testenv:quality]
runner = uv-venv-lock-runner
dependency_groups = quality
commands =
    ruff check .
    ruff format --check .

[testenv:docs]
runner = uv-venv-lock-runner
basepython = python3.12
setenv =
    DJANGO_SETTINGS_MODULE = forum.settings.test
    PYTHONPATH = {toxinidir}
    SPHINXOPTS = -W
allowlist_externals =
    make
    rm
dependency_groups = doc
commands =
    doc8 --ignore-path docs/_build README.rst docs
    rm -f docs/forum.rst
    rm -f docs/modules.rst
    make -e -C docs clean
    make -e -C docs html

[testenv:mypy]
runner = uv-venv-lock-runner
dependency_groups = quality
commands =
    mypy forum

[testenv:pii_check]
runner = uv-venv-lock-runner
dependency_groups = test
setenv =
    DJANGO_SETTINGS_MODULE = forum.settings.test
commands =
    code_annotations django_find_annotations --config_file .pii_annotations.yml --lint --report --coverage

[testenv:e2e]
runner = uv-venv-lock-runner
dependency_groups = test
allowlist_externals =
    make
commands =
    make test-e2e

[testenv:package]
runner = uv-venv-lock-runner
dependency_groups = test-base
allowlist_externals =
    bash
commands =
    python -m build
    twine check dist/*
